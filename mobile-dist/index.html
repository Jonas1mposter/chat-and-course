<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>超脑 Studio</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0F172A;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .loader {
        text-align: center;
        color: #e2e8f0;
      }
      .spinner {
        width: 40px;
        height: 40px;
        margin: 0 auto 16px;
        border: 3px solid rgba(255,255,255,0.2);
        border-top-color: #3B82F6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      p { margin: 0; font-size: 14px; opacity: 0.7; }
    </style>
  </head>
  <body>
    <div class="loader">
      <div class="spinner"></div>
      <p>Loading Superbrain Studio...</p>
    </div>
    <div style="position:fixed;left:0;right:0;bottom:0;height:32px;display:flex;align-items:center;justify-content:center;border-top:1px solid rgba(255,255,255,0.08);">
      <a href="https://beian.miit.gov.cn/" style="color:#64748b;font-size:11px;text-decoration:none;">沪ICP备2025139369号</a>
    </div>
  </body>
</html>
